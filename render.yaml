services:
  - type: web
    name: loadlink-pakistan
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema=./schema.prisma
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loadlink-pakistan-db
          property: connectionString

databases:
  - name: loadlink-pakistan-db
    plan: free
